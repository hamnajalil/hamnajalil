<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="380" height="150" role="img" aria-label="AI Project Kit">
  <defs>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:20px;fill:#f4f0ff;letter-spacing:1px}
      .d{font-family:Georgia,'Times New Roman',serif;font-size:13px;fill:#a894d2}
      .s{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;fill:#80c898}
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      .p{animation:pulse 2.6s ease-in-out infinite}
    </style>
  </defs>
  <rect x="1" y="1" width="378" height="148" rx="14" fill="#221e32" stroke="#a894d2" stroke-opacity=".35"/>
  <rect x="1" y="1" width="378" height="148" rx="14" fill="none" stroke="#c090e0" stroke-opacity=".15" stroke-width="3"/>
  <g stroke="#c090e0" stroke-width="2" fill="none"><rect x="28" y="36" width="40" height="52" rx="4"/><path d="M36 50h24M36 62h24M36 74h16"/></g>
  <text class="t" x="92" y="52">AI Project Kit</text>
  <text class="d" x="92" y="78">Five documents and one routine that let</text>
  <text class="d" x="92" y="98">any AI pick up a project cold.</text>
  <circle class="p" cx="100" cy="124" r="3.5" fill="#80c898"/>
  <text class="s" x="110" y="128">QUEST CLEARED · TEMPLATE</text>
