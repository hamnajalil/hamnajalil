<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hamna Jalil. Technical PM, Game Producer, AI and Tech Lead.">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1e38"/>
      <stop offset="0.55" stop-color="#1c1828"/>
      <stop offset="1" stop-color="#0d0918"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c090e0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c090e0" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:64px;letter-spacing:10px;fill:#f4f0ff}
      .sub{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:20px;letter-spacing:3px;fill:#c090e0}
      .tag{font-family:'Courier New',monospace;font-size:12px;letter-spacing:3px;fill:#a894d2;opacity:.8}
      .wave{fill:none;stroke:#a894d2;stroke-width:1.2}
      .star{fill:#f4f0ff}
      @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-240px)}}
      @keyframes drift2{from{transform:translateX(-240px)}to{transform:translateX(0)}}
      @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
      @keyframes sweep{0%{transform:rotate(-28deg)}50%{transform:rotate(28deg)}100%{transform:rotate(-28deg)}}
      @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
      @keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:.6}to{transform:translateY(-140px);opacity:0}}
      .w1{animation:drift 14s linear infinite}
      .w2{animation:drift2 22s linear infinite;opacity:.55}
      .w3{animation:drift 30s linear infinite;opacity:.3}
      .s1{animation:twinkle 3.2s ease-in-out infinite}
      .s2{animation:twinkle 4.1s ease-in-out .9s infinite}
      .s3{animation:twinkle 5s ease-in-out 1.7s infinite}
      .beam{transform-origin:1060px 92px;animation:sweep 9s ease-in-out infinite}
      .lamp{animation:pulse 3s ease-in-out infinite}
      .b1{animation:rise 7s linear infinite}
      .b2{animation:rise 9s linear 2s infinite}
      .b3{animation:rise 8s linear 4.5s infinite}
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#sea)"/>

  <!-- stars -->
  <g>
    <circle class="star s1" cx="90" cy="48" r="1.6"/>
    <circle class="star s2" cx="210" cy="30" r="1.2"/>
    <circle class="star s3" cx="330" cy="62" r="1.4"/>
    <circle class="star s2" cx="520" cy="26" r="1.1"/>
    <circle class="star s1" cx="690" cy="54" r="1.5"/>
    <circle class="star s3" cx="820" cy="34" r="1.2"/>
    <circle class="star s1" cx="940" cy="58" r="1.3"/>
    <circle class="star s2" cx="1140" cy="40" r="1.4"/>
    <circle class="star s3" cx="160" cy="96" r="1"/>
    <circle class="star s1" cx="760" cy="100" r="1"/>
  </g>

  <!-- beacon -->
  <g class="beam"><rect x="700" y="80" width="360" height="24" fill="url(#beam)"/></g>
  <g>
    <rect x="1050" y="92" width="20" height="60" fill="#221e32" stroke="#a894d2" stroke-opacity=".5"/>
    <rect x="1046" y="150" width="28" height="6" fill="#221e32" stroke="#a894d2" stroke-opacity=".5"/>
    <circle class="lamp" cx="1060" cy="92" r="6" fill="#22d3ee"/>
    <circle cx="1060" cy="92" r="30" fill="url(#glow)"/>
  </g>

  <!-- waves -->
  <g class="w3"><path class="wave" d="M0 190 q30 -10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/></g>
  <g class="w2"><path class="wave" d="M-240 206 q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/></g>
  <g class="w1"><path class="wave" d="M0 222 q30 -12 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/></g>

  <!-- bubbles -->
  <g fill="none" stroke="#c090e0" stroke-opacity=".6">
    <circle class="b1" cx="140" cy="300" r="3"/>
    <circle class="b2" cx="420" cy="305" r="2"/>
    <circle class="b3" cx="860" cy="300" r="2.5"/>
  </g>

  <!-- name -->
  <text class="name" x="80" y="140">HAMNA JALIL</text>
  <text class="sub" x="83" y="172">Technical PM · Game Producer · AI &amp; Tech Lead</text>

  <!-- depth gauge -->
  <text class="tag" x="80" y="288">DEPTH 0 m · LAHORE · PLAYING ON GLOBAL SERVERS</text>
  <text class="tag" x="1120" y="288" text-anchor="end">hamnajalil.com</text>
</svg>
